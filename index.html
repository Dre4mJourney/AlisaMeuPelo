<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admissão - Partido Missão</title>
  </head>
<body>
  <img class="onca" src="https://i.pinimg.com/736x/57/dc/ca/57dccac2cdc325b09421d448966052a2.jpg" height="150" alt="Logo Partido Missão"><br>
  <h1><strong>Formulário para admissão ao</strong> <br><strong>partido Missão</strong></h1>
  
  <div class="container">
    <form action="#" method="POST">
      
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail de Contato:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="16" max="120">
      </div>

            <div class="form-group">
        <label for="telemovel">Telemóvel / WhatsApp:</label>
        <input type="tel" id="telemovel" name="telemovel" placeholder="(00) 00000-0000">
        
        <label for="horario">Melhor horário para contacto:</label>
        <input type="time" id="horario" name="horario">
      </div>

            <div class="form-group">
        <label for="redes_sociais">Link para Portefólio, Rede Social ou GitHub (Opcional):</label>
        <input type="url" id="redes_sociais" name="redes_sociais" placeholder="https://...">
            </div>

      <div class="form-group">
        <label for="senha">Crie uma palavra-passe para o portal do membro:</label>
        <input type="password" id="senha" name="senha" required>
      </div>

      <div class="form-group">
        <label for="estado">Estado de Residência:</label>
        <select id="estado" name="estado">
          <option value="TO">Tocantins (TO)</option>
          <option value="DF">Distrito Federal (DF)</option>
          <option value="GO">Goiás (GO)</option>
          <option value="SP">São Paulo (SP)</option>
          <option value="RJ">Rio de Janeiro (RJ)</option>
          <option value="RS">Rio Grande do Sul (RS)</option>
          <option value="SC">Santa Catarina (SC)</option>
          <option value="MA">Maranhão (MA)</option>
          <option value="PR">Paraná (PR)</option>
          <option value="MT">Mato Grosso (MT)</option>
          <option value="ES">Espirito Santo (ES)</option>
          <option value="MS">Mato Grosso do Sul (MS)</option>
          <option value="BA">Bahia (BA)</option>
          <option value="PI">Piauí (PI)</option>
          <option value="MG">Minas Gerais (MG)</option>
          <option value="CE">Ceará (CE)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="data_filiacao">Data Desejada para Filiação:</label>
        <input type="date" id="data_filiacao" name="data_filiacao">
      </div>

      <div class="form-group">
        <label>Já foi filiado a outro partido político?</label>
        <input type="radio" id="sim" name="historico" value="sim">
        <label for="sim" class="inline">Sim</label>
        
        <input type="radio" id="nao" name="historico" value="nao" checked>
        <label for="nao" class="inline">Não</label>
      </div>

            <div class="form-group">
        <label>Áreas de interesse para atuar no partido:</label>
        <br>
        <input type="checkbox" id="area_tech" name="areas" value="tecnologia">
        <label for="area_tech" class="inline">Tecnologia e Inovação</label><br>
        
        <input type="checkbox" id="area_meio_ambiente" name="areas" value="meio_ambiente">
        <label for="area_meio_ambiente" class="inline">Sustentabilidade (ex: Gestão de Resíduos Eletrónicos)</label><br>
        
        <input type="checkbox" id="area_desporto" name="areas" value="desporto">
        <label for="area_desporto" class="inline">Desporto e Lazer</label><br>
            </div>

      <div class="form-group">
        <label for="justificativa">Por que deseja ingressar na Missão?</label>
        <textarea id="justificativa" name="justificativa" rows="4" placeholder="Escreva seus motivos aqui..."></textarea>
      </div>

      <div class="form-group">
        <label for="documento">Anexar Documento de Identidade (PDF/JPG):</label>
        <input type="file" id="documento" name="documento">
      </div>

      <div class="form-group">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos" class="inline">Li e aceito o estatuto do partido.</label>
      </div>

      <div class="form-group botoes">
        <button type="submit" class="btn-enviar">Solicitar Admissão</button>
        <input type="reset" class="btn-limpar" value="Limpar Dados">
      </div>

    </form>  
  </div>
    <footer>
    <p>&copy; 2026 Partido Missão. Todos os direitos reservados.</p>
    <p>Peço perdão por inserir política na atividade</p>
    </footer>
  
</body>
</html>
